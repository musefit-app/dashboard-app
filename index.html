<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUSE FIT 経営ダッシュボード</title>
  <style>
    /* 経営層向けに、シンプルで視認性の高いモダンデザインを採用 */
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f0f2f5; color: #333; margin: 0; padding: 10px; }
    .container { max-width: 600px; margin: 0 auto; background: transparent; padding: 0; }
    
    .header-card { background: #434343; color: white; padding: 15px 20px; border-radius: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { margin: 0; font-size: 18px; font-weight: 700; }
    
    .store-select-wrap { display: flex; align-items: center; gap: 10px; }
    select { padding: 8px 12px; border-radius: 6px; border: none; font-size: 14px; font-weight: bold; color: #333; background: #fff2cc; outline: none; }
    
    .card { background: #ffffff; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    .card-title { font-size: 15px; font-weight: bold; color: #333; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; border-bottom: 2px solid #eee; padding-bottom: 8px; }
    
    /* 税込・税抜 切替トグルスイッチ */
    .tax-toggle-group {
      display: inline-flex;
      background: #ece8f4;
      border-radius: 20px;
      padding: 3px;
      border: 1px solid #d5cce6;
    }
    .tax-toggle-btn {
      border: none;
      background: transparent;
      color: #5c4b85;
      font-size: 12px;
      font-weight: bold;
      padding: 5px 12px;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tax-toggle-btn.active {
      background: #705e9e;
      color: #fff;
      box-shadow: 0 2px 5px rgba(112, 94, 158, 0.3);
    }
    .tax-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 10px;
      margin-left: 6px;
      background: #f0edf6;
      color: #4f3e78;
      border: 1px solid #d5cce6;
    }

    /* 売上テーブルのデザイン */
    .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .data-table th, .data-table td { padding: 10px 5px; text-align: right; border-bottom: 1px solid #f0f0f0; }
    .data-table th { color: #666; font-weight: normal; background-color: #fafafa; border-top: 1px solid #eee; border-bottom: 2px solid #eee;}
    .data-table th:first-child, .data-table td:first-child { text-align: left; font-weight: bold; color: #555; }
    
    .total-row td { font-weight: bold; color: #d9423e; font-size: 14px; background-color: #fff9f9; }
    
    /* KPIカードのデザイン */
    .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .kpi-box { background: #f8f9fa; padding: 15px; border-radius: 8px; text-align: center; border: 1px solid #eee; }
    .kpi-label { font-size: 11px; color: #666; font-weight: bold; margin-bottom: 5px; text-transform: uppercase; }
    .kpi-value { font-size: 18px; font-weight: bold; color: #705e9e; }
    
    .loader { display: none; text-align: center; color: #8e7cc3; font-weight: bold; margin: 20px 0; font-size: 14px; background: #ffffff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.04);}

    /* 月別明細カードのスタイル */
    .detail-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 10px; scrollbar-width: none; }
    .detail-tabs::-webkit-scrollbar { display: none; }
    .tab-btn { flex: 1; min-width: 80px; padding: 7px 10px; font-size: 12px; font-weight: bold; border: 1px solid #d5cce6; background: #fff; color: #5c4b85; border-radius: 8px; cursor: pointer; text-align: center; white-space: nowrap; transition: 0.15s; }
    .tab-btn.active { background: #705e9e; color: #fff; border-color: #705e9e; box-shadow: 0 2px 6px rgba(112,94,158,0.25); }
    .type-switch { display: flex; gap: 8px; margin-bottom: 12px; }
    .type-btn { flex: 1; padding: 8px 12px; font-size: 13px; font-weight: bold; border: 1px solid #ccc; background: #f8f9fa; color: #555; border-radius: 8px; cursor: pointer; text-align: center; transition: 0.15s; }
    .type-btn.active-active { background: #e8f5e9; color: #2e7d32; border-color: #81c784; box-shadow: 0 2px 5px rgba(46,125,50,0.15); }
    .type-btn.active-quit { background: #ffebee; color: #c62828; border-color: #e57373; box-shadow: 0 2px 5px rgba(198,40,40,0.15); }
    .filter-bar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
    .search-input { flex: 1; padding: 7px 10px; border-radius: 6px; border: 1px solid #ddd; font-size: 12px; outline: none; }
    .detail-count-badge { font-size: 12px; font-weight: bold; color: #705e9e; background: #f0edf6; padding: 4px 10px; border-radius: 12px; white-space: nowrap; }
    .detail-table-wrap { max-height: 420px; overflow-y: auto; overflow-x: auto; border: 1px solid #eee; border-radius: 8px; }
    .detail-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .detail-table th { position: sticky; top: 0; background: #f5f2fa; color: #433867; font-weight: bold; padding: 8px 6px; text-align: left; border-bottom: 2px solid #ddd; white-space: nowrap; z-index: 1; }
    .detail-table td { padding: 8px 6px; border-bottom: 1px solid #f0f0f0; text-align: left; }
    .clickable-cell { cursor: pointer; text-decoration: underline; color: #705e9e; font-weight: bold; }
    .clickable-cell:hover { background-color: #f0edf6; }
  </style>
</head>
<body>

<div class="container">
  
  <div class="header-card">
    <h2>📊 経営ダッシュボード</h2>
    <div class="store-select-wrap">
      <select id="storeSelect" onchange="loadDashboardData()">
        <option value="全社">全社</option>
        <option value="並木">並木</option>
        <option value="横川">横川</option>
        <option value="CHANGE FIT">CHANGE FIT</option>
      </select>
    </div>
  </div>

  <div id="globalLoader" class="loader">最新のデータを集計中...</div>

  <div id="dashboardContent" style="display: none;">
    
    <!-- 売上集計カード -->
    <div class="card">
      <div class="card-title">
        <div style="display:flex; align-items:center; flex-wrap:wrap;">
          <span>💰 1. 売上合計推移 (確定実績ベース)</span>
          <span id="salesTaxBadge" class="tax-badge">税込表示</span>
        </div>
        <div class="tax-toggle-group">
          <button type="button" id="btnTaxIncluded" class="tax-toggle-btn active" onclick="setTaxMode(false)">税込</button>
          <button type="button" id="btnTaxExcluded" class="tax-toggle-btn" onclick="setTaxMode(true)">税抜</button>
        </div>
      </div>
      <table class="data-table" id="salesTable">
        <thead>
          <tr id="salesHeader">
            <th>項目</th>
            <!-- 月のラベルが入ります -->
          </tr>
        </thead>
        <tbody>
          <!-- 売上データが入ります -->
        </tbody>
      </table>
    </div>

    <!-- 会員数集計カード -->
    <div class="card">
      <div class="card-title">👥 2. 会員数推移</div>
      <table class="data-table" id="membersTable">
        <thead>
          <tr id="membersHeader">
            <th>項目</th>
            <!-- 月のラベルが入ります -->
          </tr>
        </thead>
        <tbody>
          <!-- 会員データが入ります -->
        </tbody>
      </table>
    </div>

    <!-- 最新KPIカード（直近月） -->
    <div class="card">
      <div class="card-title">📈 3. 当月 重要KPI (推定値)</div>
      <div class="kpi-grid">
        <div class="kpi-box">
          <div class="kpi-label">解約率 (月次)</div>
          <div class="kpi-value" id="kpi-churn">- %</div>
        </div>
        <div class="kpi-box">
          <div class="kpi-label">客単価 (ARPU)</div>
          <div class="kpi-value" id="kpi-arpu">- 円</div>
        </div>
        <div class="kpi-box" style="grid-column: span 2;">
          <div class="kpi-label">推定LTV (顧客生涯価値)</div>
          <div class="kpi-value" id="kpi-ltv" style="color: #d9423e; font-size: 22px;">- 円</div>
        </div>
      </div>
    </div>

    <!-- 会員詳細明細カード（月別・店舗別） -->
    <div class="card" id="detailCard">
      <div class="card-title">
        <span>📋 4. 会員詳細明細（月別・店舗別）</span>
        <span id="detailStoreBadge" class="tax-badge">全社</span>
      </div>

      <!-- 月選択タブ -->
      <div class="detail-tabs" id="detailMonthTabs"></div>

      <!-- 表示区分切替 (入会中 / 退会) -->
      <div class="type-switch">
        <button type="button" id="btnTypeActive" class="type-btn active-active" onclick="switchDetailType('active')">
          👥 入会中人数 (<span id="countActive">0</span>名)
        </button>
        <button type="button" id="btnTypeQuit" class="type-btn" onclick="switchDetailType('quit')">
          🚪 退会人数 (<span id="countQuit">0</span>名)
        </button>
      </div>

      <!-- 検索・件数バー -->
      <div class="filter-bar">
        <input type="text" id="detailSearchInput" class="search-input" placeholder="氏名・店舗・コース・担当などで絞り込み..." oninput="renderDetailTable()">
        <span id="detailFilteredBadge" class="detail-count-badge">0 件</span>
      </div>

      <!-- 明細スクロールテーブル -->
      <div class="detail-table-wrap">
        <table class="detail-table" id="detailTable">
          <thead>
            <tr id="detailTableHeader"></tr>
          </thead>
          <tbody id="detailTableBody"></tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<script>
  // =========================================================================
  // ★ GAS WebアプリのデプロイURL
  // =========================================================================
  var PRIMARY_GAS_URL = "https://script.google.com/macros/s/AKfycbz_ju5oS8sJcUz_G6qqzIY_Bw30JKif_-pQ_6b69QmtTKAndyjMi4Jl-V_AefTRslJG/exec";
  var FALLBACK_GAS_URL = "https://script.google.com/macros/s/AKfycbxADTPjdJtTLa-gR3Lmy-gsCYJ45a0t0I8tBJf-fUEYw3rhpWnlrPBZsaxg2uEYZVCf/exec";
  // =========================================================================

  var isTaxExcluded = false; // false = 税込(デフォルト), true = 税抜(÷1.1)
  var lastDashboardData = null;

  function convertTaxAmount(amount) {
    var num = Number(amount || 0);
    if (!isTaxExcluded) return Math.round(num);
    return Math.round(num / 1.1);
  }

  function setTaxMode(excludeTax) {
    isTaxExcluded = !!excludeTax;
    var btnInc = document.getElementById('btnTaxIncluded');
    var btnExc = document.getElementById('btnTaxExcluded');
    var badge = document.getElementById('salesTaxBadge');
    if (btnInc && btnExc) {
      btnInc.className = 'tax-toggle-btn' + (!isTaxExcluded ? ' active' : '');
      btnExc.className = 'tax-toggle-btn' + (isTaxExcluded ? ' active' : '');
    }
    if (badge) {
      badge.innerText = isTaxExcluded ? '税抜表示 (10%税抜)' : '税込表示';
      badge.style.background = isTaxExcluded ? '#fff3e0' : '#f0edf6';
      badge.style.color = isTaxExcluded ? '#e65100' : '#4f3e78';
      badge.style.borderColor = isTaxExcluded ? '#ffcc80' : '#d5cce6';
    }
    if (lastDashboardData) {
      renderDashboard(lastDashboardData);
    }
  }

  window.onload = function() {
    loadDashboardData();
  };

  function loadDashboardData() {
    var targetStore = document.getElementById('storeSelect').value;
    document.getElementById('dashboardContent').style.display = 'none';
    showLoader("最新のデータを集計中...");

    var url1 = PRIMARY_GAS_URL + "?action=getDashboard&store=" + encodeURIComponent(targetStore) + "&_t=" + Date.now();
    var url2 = FALLBACK_GAS_URL + "?action=getDashboard&store=" + encodeURIComponent(targetStore) + "&_t=" + Date.now();

    fetch(url1)
      .then(function(r) { return r.json(); })
      .then(function(res) {
        if (res && res.success && res.data) return res;
        return fetch(url2).then(function(r2) { return r2.json(); });
      })
      .catch(function() {
        return fetch(url2).then(function(r2) { return r2.json(); });
      })
      .then(function(res) {
        hideLoader();
        if(res && res.success) {
          lastDashboardData = res.data;
          renderDashboard(res.data);
          document.getElementById('dashboardContent').style.display = 'block';
        } else {
          alert("データ取得に失敗しました: " + (res ? res.message : ""));
        }
      })
      .catch(function(err) {
        hideLoader();
        alert("通信エラーが発生しました。");
      });
  }

  function renderDashboard(data) {
    var taxLabel = isTaxExcluded ? "税抜" : "税込";

    // テーブルヘッダーの生成（左から古い順➔新しい時系列にするため、3,2,1,0の順にループ）
    var headerHTML = "<th>項目</th>";
    for(var i=3; i>=0; i--) {
       headerHTML += "<th>" + String(data.months[i] || "").replace("年", "<br>") + "</th>";
    }
    document.getElementById('salesHeader').innerHTML = headerHTML;
    document.getElementById('membersHeader').innerHTML = headerHTML;

    // --- 1. 売上テーブルの描画（税込 / 税抜 連動） ---
    var salesTbody = "";
    salesTbody += "<tr class='total-row'><td>売上合計 (" + taxLabel + ")</td>";
    for(var i=3; i>=0; i--) { salesTbody += "<td>¥" + convertTaxAmount(data.sales.total[i]).toLocaleString() + "</td>"; }
    salesTbody += "</tr>";
    
    // 支払方法別の描画
    var payments = ['ストアーズ', 'トワライズ', 'PAYSYS', '会費PAY', '現金'];
    payments.forEach(function(p) {
      if (data.sales.payment && data.sales.payment[p]) {
        salesTbody += "<tr><td>" + p + "</td>";
        for(var i=3; i>=0; i--) { salesTbody += "<td>¥" + convertTaxAmount(data.sales.payment[p][i]).toLocaleString() + "</td>"; }
        salesTbody += "</tr>";
      }
    });
    document.querySelector('#salesTable tbody').innerHTML = salesTbody;

    // --- 2. 会員テーブルの描画 ---
    var memTbody = "";
    memTbody += "<tr><td>入会中</td>";
    for(var i=3; i>=0; i--) {
      memTbody += "<td class='clickable-cell' onclick='jumpToDetail(" + i + ", \"active\")' title='タップで明細を表示'>" + (data.members.active[i] || 0) + "名</td>";
    }
    memTbody += "</tr>";
    memTbody += "<tr><td>休会中</td>";
    for(var i=3; i>=0; i--) { memTbody += "<td>" + (data.members.pause[i] || 0) + "名</td>"; }
    memTbody += "</tr>";
    memTbody += "<tr><td>退会者</td>";
    for(var i=3; i>=0; i--) {
      memTbody += "<td class='clickable-cell' onclick='jumpToDetail(" + i + ", \"quit\")' title='タップで明細を表示'>" + (data.members.quit[i] || 0) + "名</td>";
    }
    memTbody += "</tr>";
    document.querySelector('#membersTable tbody').innerHTML = memTbody;

    // --- 3. KPIの計算と描画（配列0番目＝当月のデータを使用、税込/税抜に連動） ---
    var currentActive = Number(data.members.active[0] || 0);
    var currentQuit = Number(data.members.quit[0] || 0);
    var currentSales = convertTaxAmount(data.sales.total[0] || 0);

    var churnRate = 0;
    var ltv = 0;
    var arpu = 0;

    var totalMembers = currentActive + currentQuit;

    if (totalMembers > 0) {
      churnRate = currentQuit / totalMembers;
    }

    if (currentActive > 0) {
      arpu = currentSales / currentActive;
      if (churnRate > 0) {
        ltv = arpu / churnRate;
      } else {
        ltv = arpu * 24;
      }
    }

    document.getElementById('kpi-churn').innerText = (churnRate * 100).toFixed(1) + " %";
    document.getElementById('kpi-arpu').innerText = "¥" + Math.round(arpu).toLocaleString() + " 円 (" + taxLabel + ")";
    document.getElementById('kpi-ltv').innerText = churnRate > 0 ?
      "¥" + Math.round(ltv).toLocaleString() + " 円 (" + taxLabel + ")" :
      "¥" + Math.round(ltv).toLocaleString() + " 円 (" + taxLabel + "・退会0想定)";

    // --- 4. 月別会員明細タブ & テーブルの描画 ---
    updateMonthTabsUI();
    renderDetailTable();
  }

  var selectedMonthIdx = 0; // 0=当月, 1=1ヶ月前, 2=2ヶ月前, 3=3ヶ月前
  var selectedDetailType = 'active'; // 'active' or 'quit'

  function updateMonthTabsUI() {
    if (!lastDashboardData) return;
    var container = document.getElementById('detailMonthTabs');
    var months = lastDashboardData.months || [];
    var html = "";
    for (var i = 0; i < months.length; i++) {
      var actClass = (i === selectedMonthIdx) ? " active" : "";
      html += "<button type='button' class='tab-btn" + actClass + "' onclick='switchDetailMonth(" + i + ")'>" + (months[i] || "") + "</button>";
    }
    container.innerHTML = html;
  }

  function switchDetailMonth(idx) {
    selectedMonthIdx = idx;
    updateMonthTabsUI();
    renderDetailTable();
  }

  function switchDetailType(type) {
    selectedDetailType = type;
    var btnA = document.getElementById('btnTypeActive');
    var btnQ = document.getElementById('btnTypeQuit');
    if (type === 'active') {
      btnA.className = 'type-btn active-active';
      btnQ.className = 'type-btn';
    } else {
      btnA.className = 'type-btn';
      btnQ.className = 'type-btn active-quit';
    }
    renderDetailTable();
  }

  function jumpToDetail(monthIdx, type) {
    selectedMonthIdx = monthIdx;
    selectedDetailType = type;
    updateMonthTabsUI();
    switchDetailType(type);
    var el = document.getElementById('detailCard');
    if (el) el.scrollIntoView({ behavior: 'smooth' });
  }

  function renderDetailTable() {
    if (!lastDashboardData) return;
    var data = lastDashboardData;
    var storeName = document.getElementById('storeSelect').value;
    document.getElementById('detailStoreBadge').innerText = storeName;

    var curActiveList = (data.details && data.details.active && data.details.active[selectedMonthIdx]) ? data.details.active[selectedMonthIdx] : [];
    var curQuitList = (data.details && data.details.quit && data.details.quit[selectedMonthIdx]) ? data.details.quit[selectedMonthIdx] : [];
    document.getElementById('countActive').innerText = curActiveList.length;
    document.getElementById('countQuit').innerText = curQuitList.length;

    var headerRow = document.getElementById('detailTableHeader');
    var tbody = document.getElementById('detailTableBody');
    var query = (document.getElementById('detailSearchInput').value || "").trim().toLowerCase();

    if (selectedDetailType === 'active') {
      // 担当・氏名を除外し、会費分類・コース区分ごとの人数を集計
      var aggMap = {};
      var totalActiveCount = 0;
      for (var i = 0; i < curActiveList.length; i++) {
        var r = curActiveList[i];
        var key = (r.store || "") + "__" + (r.category || "-") + "__" + (r.course || "-");
        if (!aggMap[key]) {
          aggMap[key] = { store: r.store || "", category: r.category || "-", course: r.course || "-", count: 0 };
        }
        aggMap[key].count++;
        totalActiveCount++;
      }
      var aggList = Object.keys(aggMap).map(function(k) { return aggMap[k]; });
      aggList.sort(function(a, b) {
        return (a.category).localeCompare(b.category, "ja") || (a.course).localeCompare(b.course, "ja") || (a.store).localeCompare(b.store, "ja");
      });

      headerRow.innerHTML = "<th>#</th><th>店舗</th><th>会費分類</th><th>コース区分</th><th style='text-align:right;'>人数</th>";
      var filtered = aggList.filter(function(r) {
        if (!query) return true;
        return (r.store && r.store.toLowerCase().indexOf(query) !== -1) ||
               (r.category && r.category.toLowerCase().indexOf(query) !== -1) ||
               (r.course && r.course.toLowerCase().indexOf(query) !== -1);
      });
      document.getElementById('detailFilteredBadge').innerText = filtered.length + " 内訳 (" + totalActiveCount + "名)";
      if (filtered.length === 0) {
        tbody.innerHTML = "<tr><td colspan='5' style='text-align:center; color:#999; padding:20px;'>該当する入会中データはありません</td></tr>";
      } else {
        var html = "";
        var sumShown = 0;
        var subtotalMap = {};
        for (var i = 0; i < filtered.length; i++) {
          var item = filtered[i];
          sumShown += item.count;
          var cat = item.category || "-";
          subtotalMap[cat] = (subtotalMap[cat] || 0) + item.count;
          html += "<tr>" +
            "<td style='color:#888; font-size:11px;'>" + (i + 1) + "</td>" +
            "<td><b>" + (item.store || "") + "</b></td>" +
            "<td>" + (item.category || "-") + "</td>" +
            "<td>" + (item.course || "-") + "</td>" +
            "<td style='text-align:right; font-weight:bold; color:#705e9e;'>" + item.count + "名</td>" +
            "</tr>";
        }
        html += "<tr style='background:#fdfcfe; border-top:1px dashed #dcd6e8;'><td colspan='5' style='padding:4px 0;'></td></tr>";
        var catKeys = Object.keys(subtotalMap).sort(function(a, b) { return a.localeCompare(b, "ja"); });
        for (var c = 0; c < catKeys.length; c++) {
          var cName = catKeys[c];
          html += "<tr style='background:#f9f7fc; font-weight:bold;'>" +
            "<td></td>" +
            "<td></td>" +
            "<td style='color:#555;'>" + cName + "</td>" +
            "<td style='color:#888; font-size:12px;'>小計</td>" +
            "<td style='text-align:right; color:#705e9e;'>" + subtotalMap[cName] + "名</td>" +
            "</tr>";
        }
        html += "<tr style='background:#ece7f5; font-weight:bold; border-top:2px solid #705e9e;'>" +
          "<td></td>" +
          "<td></td>" +
          "<td style='color:#333; font-size:13px;'>【総合計】</td>" +
          "<td></td>" +
          "<td style='text-align:right; color:#705e9e; font-size:14px;'>" + sumShown + "名</td>" +
          "</tr>";
        tbody.innerHTML = html;
      }
    } else {
      headerRow.innerHTML = "<th>#</th><th>店舗</th><th>氏名</th><th>在籍年月</th><th>退会理由</th><th>退会日</th>";
      var filtered = curQuitList.filter(function(r) {
        if (!query) return true;
        return (r.name && r.name.toLowerCase().indexOf(query) !== -1) ||
               (r.store && r.store.toLowerCase().indexOf(query) !== -1) ||
               (r.tenure && r.tenure.toLowerCase().indexOf(query) !== -1) ||
               (r.reason && r.reason.toLowerCase().indexOf(query) !== -1);
      });
      document.getElementById('detailFilteredBadge').innerText = filtered.length + " 件";
      if (filtered.length === 0) {
        tbody.innerHTML = "<tr><td colspan='6' style='text-align:center; color:#999; padding:20px;'>該当する退会データはありません</td></tr>";
      } else {
        var html = "";
        for (var i = 0; i < filtered.length; i++) {
          var item = filtered[i];
          html += "<tr>" +
            "<td style='color:#888; font-size:11px;'>" + (i + 1) + "</td>" +
            "<td><b>" + (item.store || "") + "</b></td>" +
            "<td><b>" + (item.name || "") + "</b> 様</td>" +
            "<td>" + (item.tenure || "-") + "</td>" +
            "<td>" + (item.reason || "-") + "</td>" +
            "<td style='color:#888;'>" + (item.quitDate || "-") + "</td>" +
            "</tr>";
        }
        tbody.innerHTML = html;
      }
    }
  }

  function showLoader(text) {
    var l = document.getElementById('globalLoader');
    l.innerText = text;
    l.style.display = 'block';
  }
  function hideLoader() {
    document.getElementById('globalLoader').style.display = 'none';
  }
</script>
</body>
</html>
